<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kiss Map</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 5px;
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
            font-size: 18px;
        }

        .controls {
            display: flex;
            gap: 4px;
            margin-bottom: 5px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 90px;
            padding: 10px 8px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:active {
            background: #45a049;
        }

        button.secondary {
            background: #f44336;
        }

        button.secondary:active {
            background: #da190b;
        }

        .map-container {
            position: relative;
            width: 100%;
            max-width: 95vw;
            max-height: calc(100vh - 110px);
            margin: 0 auto;
            background: #e8e8e8;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            touch-action: none;
        }

        .body-image {
            width: 100%;
            height: 100%;
            max-height: calc(100vh - 110px);
            display: block;
            object-fit: contain;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .stats {
            text-align: center;
            margin-top: 5px;
            font-size: 12px;
            color: #888;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>💋 Kiss Map</h1>
        <div class="stats" style="margin-bottom: 10px;">
            <p>Tap anywhere to add points</p>
            <p>Points: <span id="pointCount">0</span></p>
        </div>

        <div class="controls">
            <button onclick="clearData()">Clear All</button>
            <button class="secondary" onclick="undoLast()">Undo Last</button>
            <button onclick="exportData()">Export Data</button>
        </div>

        <div class="map-container" id="mapContainer">

                    <ellipse cx="115" cy="38" rx="4" ry="6" fill="#888"/>

                    <!-- Nose -->

                    <!-- Forehead detail line -->

                    <!-- Thumb -->

                    <!-- Fingers -->
                    <ellipse cx="40" cy="200" rx="1.2" ry="2.5" fill="#c8c8c8" stroke="#999" stroke-width="0.8"/>
                    <ellipse cx="42" cy="201" rx="1.2" ry="2.5" fill="#c8c8c8" stroke="#999" stroke-width="0.8"/>

                    <!-- Right hand with fingers -->
                    <ellipse cx="159" cy="195" rx="4" ry="6" fill="#c8c8c8" stroke="#999" stroke-width="1"/>
                    <!-- Thumb -->
                    <ellipse cx="162" cy="193" rx="1.5" ry="3" fill="#c8c8c8" stroke="#999" stroke-width="0.8"/>
                    <!-- Fingers -->
                    <ellipse cx="160" cy="200" rx="1.2" ry="2.5" fill="#c8c8c8" stroke="#999" stroke-width="0.8"/>
                    <ellipse cx="158" cy="201" rx="1.2" ry="2.5" fill="#c8c8c8" stroke="#999" stroke-width="0.8"/>
                    <ellipse cx="156" cy="200" rx="1.2" ry="2.5" fill="#c8c8c8" stroke="#999" stroke-width="0.8"/>

                    <!-- Left foot with toes -->
                    <ellipse cx="78" cy="384" rx="8" ry="5" fill="#c8c8c8" stroke="#999" stroke-width="1"/>
                    <circle cx="73" cy="383" r="1.5" fill="#b8b8b8" stroke="#999" stroke-width="0.5"/>
                    <circle cx="76" cy="382" r="1.5" fill="#b8b8b8" stroke="#999" stroke-width="0.5"/>
                    <circle cx="79" cy="382" r="1.5" fill="#b8b8b8" stroke="#999" stroke-width="0.5"/>
                    <circle cx="82" cy="383" r="1.3" fill="#b8b8b8" stroke="#999" stroke-width="0.5"/>

                    <!-- Right foot with toes -->
                    <ellipse cx="122" cy="384" rx="8" ry="5" fill="#c8c8c8" stroke="#999" stroke-width="1"/>
                    <circle cx="127" cy="383" r="1.5" fill="#b8b8b8" stroke="#999" stroke-width="0.5"/>
                    <circle cx="124" cy="382" r="1.5" fill="#b8b8b8" stroke="#999" stroke-width="0.5"/>
                    <circle cx="121" cy="382" r="1.5" fill="#b8b8b8" stroke="#999" stroke-width="0.5"/>
                    <circle cx="118" cy="383" r="1.3" fill="#b8b8b8" stroke="#999" stroke-width="0.5"/>

                </g>
            </svg>
            <canvas id="heatmapCanvas"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('heatmapCanvas');
        const ctx = canvas.getContext('2d');
        const mapContainer = document.getElementById('mapContainer');
        const pointCount = document.getElementById('pointCount');

        let dataPoints = [];
        const RADIUS = 10; // Heat radius around each point

        // Load saved data
        function loadData() {
            const saved = localStorage.getItem('bodyHeatmapData');
            if (saved) {
                dataPoints = JSON.parse(saved);
                updateDisplay();
            }
        }

        // Save data
        function saveData() {
            localStorage.setItem('bodyHeatmapData', JSON.stringify(dataPoints));
        }

        // Set canvas size to match container
        function resizeCanvas() {
            const rect = mapContainer.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            updateDisplay();
        }

        // Add point on click/tap
        function addPoint(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

            // Normalize coordinates (0-1)
            const normalizedX = x / rect.width;
            const normalizedY = y / rect.height;

            dataPoints.push({
                x: normalizedX,
                y: normalizedY,
                timestamp: Date.now()
            });

            saveData();
            updateDisplay();
        }

        // Draw heat map using pixel-based density calculation with relative intensity
        function updateDisplay() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (dataPoints.length === 0) {
                pointCount.textContent = 0;
                return;
            }

            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;
            const heatRadius = RADIUS * 0.8;

            // First pass: calculate all heat values and find maximum
            const heatMap = new Float32Array(canvas.width * canvas.height);
            let maxHeat = 0;

            for (let py = 0; py < canvas.height; py++) {
                for (let px = 0; px < canvas.width; px++) {
                    let totalHeat = 0;

                    // Check distance to all data points
                    dataPoints.forEach(point => {
                        const pointX = point.x * canvas.width;
                        const pointY = point.y * canvas.height;
                        const dist = Math.sqrt((px - pointX) ** 2 + (py - pointY) ** 2);

                        if (dist <= heatRadius) {
                            // Gradient from 1.0 (center) to 0.75 (edge)
                            const contribution = 1.0 - (dist / heatRadius) * 0.25;
                            totalHeat += contribution;
                        }
                    });

                    heatMap[py * canvas.width + px] = totalHeat;
                    if (totalHeat > maxHeat) maxHeat = totalHeat;
                }
            }

            // Second pass: normalize to max and render
            for (let py = 0; py < canvas.height; py++) {
                for (let px = 0; px < canvas.width; px++) {
                    const totalHeat = heatMap[py * canvas.width + px];

                    if (totalHeat > 0.01) {
                        // Normalize to max heat (relative intensity)
                        const normalizedHeat = totalHeat / maxHeat;
                        const intensity = Math.pow(normalizedHeat, 0.8);

                        // Red gradient with transparency at edges
                        const r = Math.floor(255 - intensity * 75);
                        const g = Math.floor(200 * (1 - intensity));
                        const b = Math.floor(200 * (1 - intensity));
                        // Remap alpha from 75-255 (instead of 0-255)
                        const a = Math.floor(75 + Math.pow(intensity, 1.5) * 180);

                        const idx = (py * canvas.width + px) * 4;
                        data[idx] = r;
                        data[idx + 1] = g;
                        data[idx + 2] = b;
                        data[idx + 3] = a;
                    }
                }
            }

            ctx.putImageData(imageData, 0, 0);
            pointCount.textContent = dataPoints.length;
        }

        // Clear all data
        function clearData() {
            if (confirm('Clear all data points?')) {
                dataPoints = [];
                saveData();
                updateDisplay();
            }
        }

        // Undo last point
        function undoLast() {
            if (dataPoints.length > 0) {
                dataPoints.pop();
                saveData();
                updateDisplay();
            }
        }

        // Export data as JSON
        function exportData() {
            const dataStr = JSON.stringify(dataPoints, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `body-heatmap-${Date.now()}.json`;
            link.click();
        }

        // Event listeners
        canvas.addEventListener('click', addPoint);
        canvas.addEventListener('touchstart', addPoint);
        window.addEventListener('resize', resizeCanvas);

        // Initialize
        resizeCanvas();
        loadData();
    </script>
</body>
</html>
